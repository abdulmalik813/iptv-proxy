services:
  iptv-proxy-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iptv-proxy-admin
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/data/iptv-proxy.db
      - JWT_SECRET=change-me-to-a-secure-random-32-byte-hex-key
      - INITIAL_ADMIN_USERNAME=admin
      - INITIAL_ADMIN_PASSWORD=admin
    volumes:
      - ./data:/data
      - ./vpn_configs:/etc/wireguard
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1

