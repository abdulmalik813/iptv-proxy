services:
  iptv-proxy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UI_URL: ${UI_URL:-http://localhost:3000/ui}
    container_name: iptv-proxy
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/iptv-proxy.db
      SESSION_SECRET: ${SESSION_SECRET:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-api-token}
      UI_URL: ${UI_URL:-http://localhost:3000/ui}
      APP_URL: ${APP_URL:-http://localhost:8080}
      GO_PROXY_ADDR: :8080
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-password}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      VPN_BYPASS_TCP_PORTS: ${VPN_BYPASS_TCP_PORTS:-3000,8080}
      VPN_CONNECT_TIMEOUT_SECONDS: ${VPN_CONNECT_TIMEOUT_SECONDS:-45}
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
    sysctls:
      net.ipv4.ip_forward: "1"
    healthcheck:
      test: ["CMD-SHELL", "UI_PATH=$$(printf '%s' \"$$UI_URL\" | sed -E 's#^[^:]+://[^/]+##; s#/$##'); curl -fsS \"http://127.0.0.1:3000$${UI_PATH}/api/health\" >/dev/null && curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-password}
    command: ["/bin/sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - iptv-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  iptv-redis-data:
