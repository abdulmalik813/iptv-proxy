services:
  iptv-proxy-admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UI_URL: ${UI_URL:-http://localhost:3000/ui}
    container_name: iptv-proxy-admin
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/iptv-proxy.db
      SESSION_SECRET: ${SESSION_SECRET:-}
      UI_URL: ${UI_URL:-http://localhost:3000/ui}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      VPN_BYPASS_TCP_PORTS: ${VPN_BYPASS_TCP_PORTS:-3000,8080}
      VPN_CONNECT_TIMEOUT_SECONDS: ${VPN_CONNECT_TIMEOUT_SECONDS:-45}
    volumes:
      - ./data:/data
      - ./vpn_configs/wireguard:/etc/wireguard
      - ./vpn_configs/openvpn:/etc/openvpn
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/ui/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - iptv-internal

  iptv-go-proxy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UI_URL: ${UI_URL:-http://localhost:3000/ui}
    container_name: iptv-go-proxy
    restart: unless-stopped
    depends_on:
      iptv-proxy-admin:
        condition: service_healthy
    network_mode: "service:iptv-proxy-admin"
    command: ["/usr/local/bin/iptv-go-proxy"]
    environment:
      GO_PROXY_ADDR: :8080
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  iptv-internal:
    driver: bridge
