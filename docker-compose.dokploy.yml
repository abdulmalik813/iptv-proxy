services:
  iptv-proxy:
    image: ghcr.io/abdulmalik813/iptv-proxy:latest
    pull_policy: always
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/iptv-proxy.db
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      UI_URL: ${UI_URL:?UI_URL is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      GO_PROXY_ADDR: :8080
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      VPN_BYPASS_TCP_PORTS: ${VPN_BYPASS_TCP_PORTS:-3000,8080}
      VPN_CONNECT_TIMEOUT_SECONDS: ${VPN_CONNECT_TIMEOUT_SECONDS:-45}
    volumes:
      - iptv-proxy-data:/data
    sysctls:
      net.ipv4.ip_forward: "1"
    healthcheck:
      test: ["CMD-SHELL", "UI_PATH=$$(printf '%s' \"$$UI_URL\" | sed -E 's#^[^:]+://[^/]+##; s#/$##'); curl -fsS \"http://127.0.0.1:3000$${UI_PATH}/api/health\" >/dev/null && curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  iptv-proxy-data:
