services:
  iptv-proxy-admin:
    image: ghcr.io/abdulmalik813/iptv-reverse-proxy:latest
    pull_policy: always
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/iptv-proxy.db
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      UI_URL: ${UI_URL:-https://iptv.yourwebpage.ca/ui}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      VPN_BYPASS_TCP_PORTS: ${VPN_BYPASS_TCP_PORTS:-3000,8080}
      VPN_CONNECT_TIMEOUT_SECONDS: ${VPN_CONNECT_TIMEOUT_SECONDS:-45}
    volumes:
      - iptv-proxy-data:/data
      - iptv-proxy-wireguard:/etc/wireguard
      - iptv-proxy-openvpn:/etc/openvpn
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/ui/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - dokploy-network
      - iptv-internal

  iptv-go-proxy:
    image: ghcr.io/abdulmalik813/iptv-reverse-proxy:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      iptv-proxy-admin:
        condition: service_healthy
    network_mode: "service:iptv-proxy-admin"
    command: ["/usr/local/bin/iptv-go-proxy"]
    environment:
      GO_PROXY_ADDR: :8080
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  iptv-proxy-data:
  iptv-proxy-wireguard:
  iptv-proxy-openvpn:

networks:
  dokploy-network:
    external: true
  iptv-internal:
    driver: bridge
