name: Cache Finalize

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cache-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      UI_URL: https://iptv.example.test/ui
      APP_URL: https://iptv.example.test
      SESSION_SECRET: ci-session-secret-not-for-production
      INTERNAL_API_TOKEN: ci-internal-api-token-not-for-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
          cache: true

      - name: Apply reviewed cache finalization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manager = Path('internal/cache/manager.go')
          s = manager.read_text()
          old = 'lockTTL          = 12 * time.Minute\n)'
          new = 'lockTTL                 = 12 * time.Minute\n\tretiredGenerationGrace = 30 * time.Minute\n)'
          if 'retiredGenerationGrace' not in s:
              assert old in s, 'cache constants pattern changed'
              s = s.replace(old, new, 1)
          s = s.replace('m.client.HStrLen(ctx, key, "body").Result()', 'm.client.Do(ctx, "HSTRLEN", key, "body").Int64()')
          old_cleanup = 'm.cleanupGeneration(context.Background(), spec.Key, oldManifest.Generation, oldManifest.ChunkCount)'
          if old_cleanup in s:
              s = s.replace(old_cleanup, 'm.retireGeneration(context.Background(), spec.Key, oldManifest.Generation, oldManifest.ChunkCount)', 1)
          if 'func (m *Manager) retireGeneration' not in s:
              marker = 'func (m *Manager) cleanupGeneration(ctx context.Context, key, generation string, chunkCount int) {'
              assert marker in s, 'cleanup generation marker changed'
              retire = '''func (m *Manager) retireGeneration(ctx context.Context, key, generation string, chunkCount int) {\n\tif generation == "" || chunkCount <= 0 {\n\t\treturn\n\t}\n\tfor i := 0; i < chunkCount; i++ {\n\t\t_ = m.client.Expire(ctx, bodyKey(key, generation, i), retiredGenerationGrace).Err()\n\t}\n}\n\n'''
              s = s.replace(marker, retire + marker, 1)
          manager.write_text(s)

          direct = Path('internal/proxy/direct_test.go')
          s = direct.read_text()
          s = s.replace('t.Fatalf("User-Agent=%q", got)', 't.Errorf("User-Agent=%q", got)')
          s = s.replace('t.Fatalf("Accept=%q", got)', 't.Errorf("Accept=%q", got)')
          direct.write_text(s)

          tests = Path('internal/cache/manager_test.go')
          s = tests.read_text()
          if 'TestPublishedGenerationSwitchKeepsPreviousGenerationDuringGrace' not in s:
              s += r'''

func TestPublishedGenerationSwitchKeepsPreviousGenerationDuringGrace(t *testing.T) {
	client := testRedis(t)
	manager := NewManager(client)
	defer stopManager(manager)
	ctx := context.Background()

	var version atomic.Int32
	version.Store(1)
	body1 := bytes.Repeat([]byte("old-cache-"), bodyChunkSize/10+2)
	body2 := bytes.Repeat([]byte("new-cache-"), bodyChunkSize/10+2)
	spec := testSpec("generation-swap", "get_vod_streams", "", func(context.Context) (Response, error) {
		if version.Load() == 1 {
			return Response{Status: 200, Body: body1, ItemCount: 1, ItemCountKnown: true}, nil
		}
		return Response{Status: 200, Body: body2, ItemCount: 1, ItemCountKnown: true}, nil
	})
	if err := manager.Warm(ctx, spec); err != nil { t.Fatal(err) }
	oldManifest, found, err := manager.loadManifest(ctx, spec.normalized().Key)
	if err != nil || !found || oldManifest.Generation == "" {
		t.Fatalf("old generation unavailable: found=%v generation=%q err=%v", found, oldManifest.Generation, err)
	}
	oldChunk := bodyKey(spec.normalized().Key, oldManifest.Generation, 0)
	version.Store(2)
	if err := manager.Purge(ctx, spec.normalized().Key); err != nil { t.Fatal(err) }
	newManifest, found, err := manager.loadManifest(ctx, spec.normalized().Key)
	if err != nil || !found || newManifest.Generation == oldManifest.Generation {
		t.Fatalf("generation pointer did not switch: old=%q new=%q found=%v err=%v", oldManifest.Generation, newManifest.Generation, found, err)
	}
	response, hit, err := manager.GetOrFetch(ctx, spec)
	if err != nil || !hit || !bytes.Equal(response.Body, body2) {
		t.Fatalf("new generation is not active: hit=%v len=%d err=%v", hit, len(response.Body), err)
	}
	if exists := client.Exists(ctx, oldChunk).Val(); exists != 1 {
		t.Fatal("previous generation was deleted immediately after pointer switch")
	}
	if ttl := client.TTL(ctx, oldChunk).Val(); ttl <= 0 || ttl > retiredGenerationGrace {
		t.Fatalf("previous generation grace TTL=%v", ttl)
	}
}

func TestLockReleaseDoesNotDeleteAnotherOwnersLock(t *testing.T) {
	client := testRedis(t)
	manager := NewManager(client)
	defer stopManager(manager)
	ctx := context.Background()
	spec := testSpec("lock-owner", "get_live_streams", "", func(context.Context) (Response, error) {
		return Response{Status: 200, Body: []byte("ok")}, nil
	}).normalized()
	locked, err := manager.acquire(ctx, spec, "test", "owner-a")
	if err != nil || !locked { t.Fatalf("owner-a failed to acquire lock: locked=%v err=%v", locked, err) }
	if err := client.Set(ctx, lockKey(spec.Key), "owner-b", lockTTL).Err(); err != nil { t.Fatal(err) }
	manager.release(spec.Key, "owner-a")
	if owner := client.Get(ctx, lockKey(spec.Key)).Val(); owner != "owner-b" {
		t.Fatalf("stale owner removed a newer lock: owner=%q", owner)
	}
}
'''
          tests.write_text(s)

          page = Path('app/cache/page.tsx')
          lines = page.read_text().splitlines()
          lines = [line for line in lines if ' const refreshEntry=async' not in line]
          s = '\n'.join(lines) + '\n'
          refresh_button = '<button onClick={()=>void refreshEntry(entry.key)} disabled={busyKey===entry.key} className="border border-neutral-700 bg-black px-2.5 py-1.5 text-[10px] font-bold uppercase hover:border-white disabled:opacity-50">Refresh</button>'
          s = s.replace(refresh_button, '')
          s = s.replace('<th className="p-3 text-right">Actions</th>', '<th className="p-3 text-right">Action</th>')
          page.write_text(s)
          PY

          cat > .github/workflows/test.yml <<'EOF'
          name: Test

          on:
            push:
              branches:
                - main
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: test-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            test:
              name: Production checks
              runs-on: ubuntu-latest
              env:
                UI_URL: https://iptv.example.test/ui
                APP_URL: https://iptv.example.test
                SESSION_SECRET: ci-session-secret-not-for-production
                INTERNAL_API_TOKEN: ci-internal-api-token-not-for-production
              services:
                redis:
                  image: redis:8-alpine
                  ports:
                    - 6379:6379
                  options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 2s
                    --health-timeout 2s
                    --health-retries 20
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                - name: Set up pnpm
                  uses: pnpm/action-setup@v4
                  with:
                    version: 11.24.0
                    run_install: false
                - name: Set up Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - name: Set up Go
                  uses: actions/setup-go@v6
                  with:
                    go-version: 1.27.x
                    cache: true
                - name: Install dependencies
                  run: pnpm install --no-frozen-lockfile
                - name: Regression contracts
                  run: pnpm test
                - name: Go formatting
                  run: test -z "$(gofmt -l .)"
                - name: Go vet
                  run: go vet ./...
                - name: Go tests
                  run: go test ./... -count=1
                - name: Go build
                  run: go build ./cmd/proxy
                - name: Lint
                  run: pnpm lint
                - name: Typecheck
                  run: pnpm typecheck
                - name: Production Next.js build
                  run: pnpm build
                - name: Validate local Compose
                  run: docker compose -f docker-compose.yml config >/dev/null
                - name: Validate Dokploy Compose
                  run: docker compose -f docker-compose.dokploy.yml config >/dev/null
          EOF

          cat >> docs/cache-design-review.md <<'EOF'

          ## Final generation publication rule
          Active cache bodies are immutable generations. A replacement is written beside the active generation, validated, and then the manifest pointer is switched. The previous generation is retained with a 30-minute Redis grace TTL so readers that resolved the old generation before the pointer switch can finish without missing chunks. Failed replacements never move the pointer.
          EOF

          gofmt -w cmd internal
          rm .github/workflows/cache-finalize.yml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Regression contracts
        run: pnpm test
      - name: Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Go vet
        run: go vet ./...
      - name: Go tests
        run: go test ./... -count=1
      - name: Go build
        run: go build ./cmd/proxy
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Production Next.js build
        run: pnpm build
      - name: Validate Compose
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.dokploy.yml config >/dev/null

      - name: Commit finalized cache architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize zero-downtime cache generations"
          git push origin HEAD:main
