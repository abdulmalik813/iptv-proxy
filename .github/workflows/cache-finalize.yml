name: Cache Finalize

on:
  push:
    branches:
      - main
    paths:
      - scripts/finalize_cache.py
      - scripts/finalize_cache_followup.py
      - .github/workflows/cache-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    name: Finalize cache architecture
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      UI_URL: https://iptv.example.test/ui
      APP_URL: https://iptv.example.test
      SESSION_SECRET: ci-session-secret-not-for-production
      INTERNAL_API_TOKEN: ci-internal-api-token-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
          cache: true

      - name: Apply reviewed finalization
        run: |
          python3 scripts/finalize_cache.py
          python3 scripts/finalize_cache_followup.py
          gofmt -w cmd internal

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Regression contracts
        run: pnpm test

      - name: Go formatting
        run: test -z "$(gofmt -l .)"

      - name: Go vet
        run: go vet ./...

      - name: Go integration scenarios
        run: go test ./... -count=1

      - name: Go build
        run: go build ./cmd/proxy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Production Next.js build
        run: pnpm build

      - name: Validate Compose
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.dokploy.yml config >/dev/null

      - name: Commit finalized architecture
        run: |
          rm .github/workflows/cache-finalize.yml scripts/finalize_cache.py scripts/finalize_cache_followup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize zero-downtime cache generations"
          git push origin HEAD:main
